openapi: 3.0.0
info:
  title: API de Flujo de Aprobaciones
  version: 1.5.0
  description: |
    Sistema de aprobaciones con firma digital concatenada (hash chain secuencial).

    Versionado: todos los endpoints van bajo el prefijo `/api/v1/`. Un futuro `/api/v2/`
    permitiría cambios incompatibles sin romper clientes existentes.

    Notas de seguridad:
    - El OTP se valida SIEMPRE contra `expira_en` en la lógica de negocio (no se depende
      del borrado por TTL de DynamoDB, que no es inmediato). El TTL es solo limpieza.
    - `/api/v1/otp/verify` exige `approver_token` y lo valida contra el GSI ANTES de comparar
      el OTP, para no exponer el factor débil (OTP de 6 dígitos) sin poseer el link.
    - Para firmar se exige un `firma_token` de un solo uso emitido por `/api/v1/otp/verify`.
    - Todos los timestamps de EXPIRACIÓN (OTP y firma_token) se manejan en segundos (epoch).

servers:
  - url: https://api.example.com/dev
    description: Entorno de desarrollo

paths:
  /api/v1/solicitudes:
    post:
      summary: Crear una solicitud de compra
      operationId: crearSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titulo
                - descripcion
                - monto
                - solicitante_email
                - solicitante_nombre
                - aprobadores
              properties:
                titulo:
                  type: string
                  example: "Compra de laptops"
                descripcion:
                  type: string
                  example: "20 laptops para el equipo de desarrollo"
                monto:
                  type: number
                  description: >
                    Monto de la compra. Se maneja como entero (pesos colombianos sin
                    decimales). Si se requieren decimales, usar centavos (entero) o string validado.
                  example: 15000000
                solicitante_email:
                  type: string
                  format: email
                  example: "juan.perez@empresa.com"
                solicitante_nombre:
                  type: string
                  example: "Juan Pérez"
                aprobadores:
                  type: array
                  minItems: 3
                  maxItems: 3
                  description: Exactamente 3 aprobadores con roles distintos. El índice define el orden de firma (1, 2, 3).
                  items:
                    type: object
                    required:
                      - nombre
                      - email
                      - rol
                    properties:
                      nombre:
                        type: string
                        example: "María Gómez"
                      email:
                        type: string
                        format: email
                        example: "maria.gomez@empresa.com"
                      rol:
                        type: string
                        example: "Jefe de Departamento"
      responses:
        '201':
          description: Solicitud creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  solicitud_id:
                    type: string
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  estado:
                    type: string
                    example: "PENDIENTE"
                  mensaje:
                    type: string
                    example: "Solicitud creada. Se enviaron los links a los aprobadores."
        '400':
          description: Error de validación (faltan campos, roles no distintos, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Listar solicitudes del solicitante
      operationId: listarSolicitudes
      description: >
        Filtra por `solicitante_email`. Requiere un GSI en `solicitante_email` en la tabla
        Solicitudes para evitar un Scan completo (ver template.yaml de SAM). NOTA: sin
        autenticación en el alcance mínimo; ver "Mejoras Propuestas" en el README.
      parameters:
        - name: solicitante_email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: Email del solicitante para filtrar sus solicitudes
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResumen'
        '400':
          description: Falta el parámetro solicitante_email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/solicitudes/{solicitud_id}:
    get:
      summary: Obtener detalle de una solicitud
      operationId: obtenerDetalleSolicitud
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
          description: ID de la solicitud
      responses:
        '200':
          description: Detalle completo de la solicitud con estados de aprobadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalle'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/approve:
    get:
      summary: Resolver token de aprobación y generar/reutilizar OTP
      operationId: resolverToken
      description: >
        Resuelve el token del aprobador (vía GSI en `token`). Si el aprobador ya tiene un
        OTP vigente (no expirado) Y con intentos disponibles (`intentos` < 3), se REUTILIZA
        sin consumir el límite. Si no hay OTP, si expiró, o si el vigente ya agotó sus 3
        intentos, se genera uno nuevo, se reinicia `intentos` a 0 y se incrementa
        `num_otp_generados`. Tratar como agotado el OTP sin intentos evita que el aprobador
        quede bloqueado hasta el TTL recibiendo un 200 sobre un código inservible. Límite de
        3 generaciones por aprobador (al superarlo responde 429): es el único bloqueo
        definitivo. Solo el aprobador cuyo turno está activo puede continuar.
      parameters:
        - name: solicitud_id
          in: query
          required: true
          schema:
            type: string
          description: ID de la solicitud
        - name: approver_token
          in: query
          required: true
          schema:
            type: string
          description: Token único del aprobador
      responses:
        '200':
          description: Token válido. OTP vigente reutilizado o nuevo generado (simulado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "OTP enviado al correo del aprobador"
                  solicitud_id:
                    type: string
                  orden:
                    type: number
                  generaciones_restantes:
                    type: number
                    description: Generaciones de OTP restantes para este aprobador (máx. 3)
                    example: 2
        '400':
          description: >
            `approver_token` inválido o que no corresponde a la solicitud indicada. El token
            del aprobador no expira (ver "Mejoras Propuestas" en el README).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Aún no es tu turno (existen aprobadores previos sin firmar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La solicitud ya está en estado terminal (COMPLETADA o RECHAZADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de generaciones de OTP superado (máximo 3 por aprobador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/otp/verify:
    post:
      summary: Validar OTP y emitir token de firma
      operationId: validarOTP
      description: >
        Valida PRIMERO el `approver_token` contra el GSI (debe corresponder a la solicitud y
        orden indicados); esto impide atacar el OTP sin poseer el link del aprobador y evita
        el DoS de agotar intentos ajenos. Luego valida el OTP contra `expira_en` en la lógica
        de negocio y controla `intentos` (máx. 3 por OTP; al superarlo responde 429). Si todo
        es correcto, devuelve el detalle de la compra y un `firma_token` de un solo uso
        (válido ~5 minutos). Tras agotar los 3 intentos, el aprobador puede solicitar un OTP
        nuevo en /api/v1/approve de inmediato (consume una generación); no hay bloqueo temporal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - solicitud_id
                - orden
                - approver_token
                - codigo
              properties:
                solicitud_id:
                  type: string
                orden:
                  type: number
                approver_token:
                  type: string
                  description: >
                    Token único del aprobador (UUID). Se valida contra el GSI ANTES de
                    comparar el OTP, para no exponer el factor débil sin superar el fuerte.
                codigo:
                  type: string
                  description: Código OTP de 6 dígitos
      responses:
        '200':
          description: OTP válido. Devuelve detalle + token de firma
          content:
            application/json:
              schema:
                type: object
                properties:
                  firma_token:
                    type: string
                    description: Token de un solo uso para autorizar la firma. Válido ~5 minutos.
                    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  expira_firma_token:
                    type: number
                    description: Timestamp de expiración del token de firma (epoch en SEGUNDOS)
                  detalle:
                    $ref: '#/components/schemas/SolicitudDetalle'
        '400':
          description: >
            approver_token inválido o que no coincide con la solicitud/orden, u OTP inválido
            o expirado. Se distingue por el campo `codigo` del Error
            (p. ej. TOKEN_INVALIDO / OTP_INVALIDO).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Aún no es tu turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Máximo de intentos de OTP superado (3 por código)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/solicitudes/{solicitud_id}/aprobadores/{orden}/firmar:
    post:
      summary: Aprobar o rechazar una solicitud
      operationId: firmarSolicitud
      description: >
        Registra la firma (APROBAR) o el rechazo (RECHAZAR). Requiere el `firma_token`
        emitido por /api/v1/otp/verify en el header `X-Firma-Token`. Al aprobar, calcula el
        hash encadenado con la firma anterior (hash chain). Cuando entra la 3ª firma, la
        solicitud pasa a FIRMAS_COMPLETAS, se genera el PDF y SOLO si eso tiene éxito pasa a
        COMPLETADA con su `pdf_key`. Usa escritura condicional (estado_firma == PENDIENTE)
        para evitar firmas duplicadas, y marca el token como usado con ConditionExpression
        `usado = false` (un solo uso). El identificador del aprobador en la ruta es `orden`
        (el SK), que refleja la secuencialidad del turno.
      security:
        - FirmaToken: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
        - name: orden
          in: path
          required: true
          schema:
            type: number
          description: Orden del aprobador (1-3). Es el SK y el identificador en la ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accion
              properties:
                accion:
                  type: string
                  enum: ['APROBAR', 'RECHAZAR']
      responses:
        '200':
          description: Acción realizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  estado:
                    type: string
                    description: Nuevo estado del aprobador (FIRMADO / RECHAZADO)
                  solicitud_estado:
                    type: string
                    description: Estado resultante (PENDIENTE / FIRMAS_COMPLETAS / COMPLETADA / RECHAZADA)
        '400':
          description: Acción inválida o solicitud en estado inconsistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token de firma o es inválido/expirado/ya usado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Turno incorrecto (aprobadores previos sin firmar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El aprobador ya firmó o la solicitud está en estado terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/solicitudes/{solicitud_id}/evidencia.pdf:
    get:
      summary: Descargar PDF con evidencia de firmas
      operationId: descargarPDF
      description: >
        Devuelve el PDF de evidencia. Recomendado: responder con una URL prefirmada de S3
        (redirección 302) en lugar de servir el binario por la Lambda, por escalabilidad.
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF generado exitosamente
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '302':
          description: Redirección a URL prefirmada de S3
          headers:
            Location:
              schema:
                type: string
              description: URL prefirmada temporal del PDF en S3
        '404':
          description: Solicitud no encontrada o sin PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Solicitud no completada aún (PDF no disponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/mock-mail:
    get:
      summary: Ver correos simulados enviados
      operationId: verMockMail
      responses:
        '200':
          description: Lista de correos simulados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    para:
                      type: string
                    asunto:
                      type: string
                    cuerpo:
                      type: string
                    timestamp:
                      type: string

components:
  securitySchemes:
    FirmaToken:
      type: apiKey
      in: header
      name: X-Firma-Token
      description: >
        Token de un solo uso emitido por /api/v1/otp/verify tras validar el OTP.
        Requerido para firmar. Válido ~5 minutos y se invalida tras su uso.

  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          description: Código de error legible por máquina (p. ej. TURNO_INVALIDO, OTP_INVALIDO, TOKEN_INVALIDO)
          example: "TURNO_INVALIDO"
        mensaje:
          type: string
          description: Mensaje de error legible por humano
          example: "Aún no es tu turno para firmar"

    SolicitudResumen:
      type: object
      properties:
        solicitud_id:
          type: string
        titulo:
          type: string
        monto:
          type: number
        estado:
          type: string
        fecha_creacion:
          type: number
        aprobadores_count:
          type: object
          properties:
            pendientes:
              type: number
            firmados:
              type: number
            rechazados:
              type: number

    SolicitudDetalle:
      type: object
      properties:
        solicitud:
          $ref: '#/components/schemas/Solicitud'
        aprobadores:
          type: array
          items:
            $ref: '#/components/schemas/Aprobador'

    Solicitud:
      type: object
      properties:
        solicitud_id:
          type: string
        titulo:
          type: string
        descripcion:
          type: string
        monto:
          type: number
        solicitante_email:
          type: string
        solicitante_nombre:
          type: string
        estado:
          type: string
          enum: ['PENDIENTE', 'FIRMAS_COMPLETAS', 'COMPLETADA', 'RECHAZADA']
          description: >
            FIRMAS_COMPLETAS es transitorio: las 3 firmas están registradas y el PDF se está
            generando. Solo tras generar el PDF con éxito pasa a COMPLETADA (con pdf_key).
        fecha_creacion:
          type: number
        pdf_key:
          type: string

    Aprobador:
      type: object
      description: >
        Vista pública del aprobador. NO expone token, codigo_hash ni num_otp_generados.
        El contador de generaciones se informa vía `generaciones_restantes` en /api/v1/approve.
      properties:
        orden:
          type: number
        approver_id:
          type: string
        nombre:
          type: string
        email:
          type: string
        rol:
          type: string
        estado_firma:
          type: string
          enum: ['PENDIENTE', 'FIRMADO', 'RECHAZADO']
        fecha_firma:
          type: number
        hash_firma:
          type: string
          description: Hash SHA256 encadenado (hash chain). Ver README, sección Firma Digital Concatenada.